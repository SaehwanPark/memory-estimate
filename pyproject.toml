[project]
  name = "memory-estimate"
  version = "0.1.0"
  description = "Architecture-aware memory estimation for local LLM inference"
  readme = "README.md"
  requires-python = ">=3.13"
  dependencies = [
    "huggingface-hub>=1.30.0",
    "pandas>=2.2.0",
    "streamlit>=1.63.0",
  ]

[tool.pytest.ini_options]
  pythonpath = ["."]
  testpaths = ["tests"]

[tool.basedpyright]
  typeCheckingMode = "standard"
  include = ["model_fetcher.py", "calculator.py", "app.py", "main.py", "tests"]


[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=9.1.1",
]
